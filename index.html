<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="shortcut icon" href="img/download.jpg">
   <title>Tic Tac Toe</title>
   <link rel="stylesheet" href="style.css">
</head>

<body>
   <!-- main container -->
   <div class="meinDiv">
      <!-- display message -->
      <div id="Show-Disply">
         <div id="show-message">
            <p id="massages"></p>
            <button id="new-game"> <span>New</span> Game </button>
         </div>
      </div>
      <!-- display message end -->

      <!-- game board -->
      <main>
         <h1> <span class="span1">Tic</span> <span class="span2">Tac</span> <span class="span3">Toe</span></h1>
         <!-- game board box -->
         <div class="mein-box">
            <div class="boxes">
               <button class="btn"></button>
               <button class="btn"></button>
               <button class="btn"></button>
               <button class="btn"></button>
               <button class="btn"></button>
               <button class="btn"></button>
               <button class="btn"></button>
               <button class="btn"></button>
               <button class="btn"></button>
            </div>
         </div>
         <!-- game board box end -->
         <!-- reset button -->
         <div>
            <button id="reset-game"><span>Reset</span> Game</button>
         </div>
      </main>
      <!-- game board end -->
   </div>
   <!-- main container end -->
   <script src="app.js"></script>
</body>

</html>
